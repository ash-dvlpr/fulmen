[package]
name = "fulmen_core"
description = "Fulmen's internals"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Modules
fulmen_renderer = { path = "../fulmen_renderer", optional = true }

# Logging
thiserror = { workspace = true }
log = { workspace = true, optional = true }

# Graphics
winit = { version = "0.30", optional = true, default-features = false, features = [
    "rwh_06",
] }

# Other
# ahash = { version = "0.8.7", default-features = false, features = [
#     "runtime-rng",
# ] }


[features]
rendering = ["dep:fulmen_renderer", "dep:winit"]
# x11 = ["rendering", "winit/x11"]
# wayland = ["rendering", "winit/wayland"]

logging = ["dep:log", "fulmen_renderer/logging"]
debug_logging = ["logging", "fulmen_renderer/debug_logging"]
