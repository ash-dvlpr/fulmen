[package]
name = "fulmen_ecs"
description = "Fulmen's Entity Component System."
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Modules
fulmen_ptr = { path = "../fulmen_ptr" }
blob = { path = "../blob" }

# Logging
thiserror = { workspace = true }
log = { workspace = true, optional = true }

# Other



[features]
logging = ["dep:log"]
debug_logging = ["logging"]
